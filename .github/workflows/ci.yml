# Las pruebas de los contratos, sobre cada pull request.
#
# Mergit no paga sin ver un CI en verde sobre el commit de cabeza del PR: la
# ausencia de CI no es CI en verde. Este archivo es, por lo tanto, lo que hace
# que un bounty en este repositorio pueda cobrarse.
#
# Corre solo lo que de verdad existe. El agente no tiene suite propia todavía,
# así que no se inventa un paso que siempre pase: un check verde que no prueba
# nada es peor que ninguno.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install
        working-directory: contracts
        run: npm ci

      - name: Test
        working-directory: contracts
        run: npx hardhat test
